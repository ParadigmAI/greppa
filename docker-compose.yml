services:
  web:
    build: .
    image: greppa-landing:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - WAITLIST_EXPORT_PASSWORD=${WAITLIST_EXPORT_PASSWORD:?set WAITLIST_EXPORT_PASSWORD in .env}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-}
    volumes:
      - ./data:/app/data
